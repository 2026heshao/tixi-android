name: Android 构建

# 触发方式：
#   1) 推送到 main 自动构建
#   2) 在 Actions 页面手动 Run workflow（可选择 debug / release）
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型
        type: choice
        options: [both, debug, release]
        default: both

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 测试与打包
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 单元测试
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: 打包 Debug
        if: ${{ github.event_name == 'push' || inputs.build_type == 'both' || inputs.build_type == 'debug' }}
        run: ./gradlew :app:assembleDebug --console=plain

      - name: 打包 Release（R8，未签名）
        if: ${{ github.event_name == 'push' || inputs.build_type == 'both' || inputs.build_type == 'release' }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 测试报告
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: 上传 Debug APK
        if: ${{ github.event_name == 'push' || inputs.build_type == 'both' || inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: tixi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 上传 Release APK
        if: ${{ github.event_name == 'push' || inputs.build_type == 'both' || inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: tixi-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 产物摘要
        if: always()
        run: |
          {
            echo "### 构建结果"
            echo ""
            echo "| 产物 | 大小 |"
            echo "| --- | --- |"
            find app/build/outputs/apk -name '*.apk' -exec sh -c 'echo "| $(basename {}) | $(du -h {} | cut -f1) |"' \;
          } >> "$GITHUB_STEP_SUMMARY"
